<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Power BI Visual Health Monitor</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#ffffff;
      color:#1a1a1a
    }

    .container{
      max-width:900px;
      margin:40px auto;
      padding:0 24px
    }

    h1{
      font-size:22px;
      font-weight:600;
      margin-bottom:6px
    }

    .sub{
      font-size:14px;
      color:#666;
      margin-bottom:28px
    }

    .card{
      background:#fdfdfd;
      border:1px solid #e5e5e5;
      border-radius:12px;
      padding:24px;
      margin-bottom:20px
    }

    label{
      display:block;
      font-size:13px;
      font-weight:500;
      color:#444;
      margin-bottom:8px
    }

    input[type=text]{
      width:100%;
      padding:10px 14px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:14px;
      outline:none;
      transition:border .15s
    }

    input[type=text]:focus{
      border-color:#5c6ac4
    }

    .btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 22px;
      border-radius:8px;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      border:none;
      transition:opacity .15s,background .15s
    }

    .btn-primary{
      background:#C9D91A;
      color:#fff;
      margin-top:14px
    }

    .btn-primary:hover{
      background:#b8c719;
    }

    .btn-primary:disabled{
      opacity:.5;
      cursor:not-allowed
    }

    .status-bar{
      display:none;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border-radius:8px;
      font-size:14px;
      margin-top:14px
    }

    .status-bar.running{
      display:flex;
      background:#eff3ff;
      color:#2CB7BE;
      border:1px solid #c5cff5
    }

    .status-bar.done-ok{
      display:flex;
      background:#f0faf4;
      color:#C9D91A;
      border:1px solid #a8dbbf
    }

    .status-bar.done-err{
      display:flex;
      background:#fff5f5;
      color:#a84242;
      border:1px solid #e67272
    }

    .status-bar.done-warning{
      display:flex;
      background:#fffbeb;
      color:#920e0e;
      border:1px solid #fcd34d
    }

    .spinner{
      width:16px;
      height:16px;
      border:2px solid currentColor;
      border-top-color:transparent;
      border-radius:50%;
      animation:spin .7s linear infinite;
      flex-shrink:0
    }

    @keyframes spin{
      to{
        transform:rotate(360deg)
      }
    }

    .progress-list{
      list-style:none;
      margin-top:4px;
      max-height:300px;
      overflow:auto
    }

    .progress-list li{
      display:flex;
      align-items:center;
      gap:10px;
      padding:7px 0;
      border-bottom:1px solid #f0f0f0;
      font-size:13px;
      color:#444
    }

    .progress-list li:last-child{
      border-bottom:none
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      flex-shrink:0
    }

    .dot.pending{
      background:#ddd
    }

    .dot.active{
      background:#5c6ac4;
      animation:pulse 1s ease-in-out infinite
    }

    .dot.ok{
      background:#C9D91A
    }

    .dot.error{
      background:#ef4444
    }

    .dot.warning{
      background:#f59e0b
    }

    @keyframes pulse{
      0%,100%{
        opacity:1
      }
      50%{
        opacity:.35
      }
    }

    .results-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px
    }

    .page-card{
      border:1px solid #e5e5e5;
      border-radius:10px;
      overflow:hidden;
      background:#fff
    }

    .page-card.error{
      border-color:#f5b8b8
    }

    .page-card.ok{
      border-color:#a8dbbf
    }

    .page-card.timeout{
      border-color:#fcd34d
    }

    .pc-header{
      padding:11px 14px;
      font-size:13px;
      font-weight:500;
      display:flex;
      align-items:center;
      gap:7px
    }

    .page-card.error .pc-header{
      background:#fff5f5;
      color:#9b1c1c
    }

    .page-card.ok .pc-header{
      background:#f0faf4;
      color:#1a6b3c
    }

    .page-card.timeout .pc-header{
      background:#fffbeb;
      color:#92400e
    }

    .page-card img{
      width:100%;
      display:block;
      cursor:zoom-in;
      border-top:1px solid #f0f0f0
    }

    .pc-body{
      padding:9px 14px;
      font-size:12px;
      color:#797979
    }

    .app-header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:24px
    }

    .app-logo{
      width:150px;
      height:150px;
      object-fit:contain;
      flex-shrink:0
    }

    .app-header h1{
      margin-bottom:4px
    }

    .app-header .sub{
      margin-bottom:0
    }

    .badge{
      display:inline-block;
      font-size:11px;
      padding:2px 9px;
      border-radius:20px;
      font-weight:500
    }

    .badge-error{
      background:#fee2e2;
      color:#9b1c1c
    }

    .badge-ok{
      background:#dcfce7;
      color:#14532d
    }

    .badge-warning{
      background:#fef3c7;
      color:#92400e
    }

    #lightbox{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.8);
      z-index:999;
      align-items:center;
      justify-content:center
    }

    #lightbox.open{
      display:flex
    }

    #lightbox img{
      max-width:92vw;
      max-height:92vh;
      border-radius:8px
    }

    #lb-close{
      position:absolute;
      top:18px;
      right:26px;
      color:#fff;
      font-size:30px;
      cursor:pointer;
      line-height:1;
      font-weight:300
    }
  </style>
</head>

<body>

<div class="container">

  <div class="app-header">

  <img
    src="./static/logo.png"
    alt="Logo"
    class="app-logo"
  />

  <div>
    <h1>Power BI Visual Health Monitor</h1>

    <p class="sub">
      Paste a report URL — the scanner opens every page and flags broken visuals automatically.
    </p>
  </div>

</div>

  <div class="card">

    <label for="url-input">Power BI report URL</label>

    <input
      type="text"
      id="url-input"
      placeholder="https://app.powerbi.com/groups/.../reports/..."
    />

    <button
      class="btn btn-primary"
      id="scan-btn"
      onclick="startScan()"
    >
      Start scan
    </button>

    <div class="status-bar" id="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Initialising...</span>
    </div>

  </div>

  <div class="card" id="progress-card" style="display:none">

    <label>Scan progress</label>

    <ul class="progress-list" id="progress-list"></ul>

  </div>

  <div class="card" id="results-card" style="display:none">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

      <label style="margin:0">Results</label>

      <span id="summary-badge" class="badge"></span>

    </div>

    <div class="results-grid" id="results-grid"></div>

  </div>

</div>

<div id="lightbox">
  <span id="lb-close" onclick="closeLb()">×</span>
  <img id="lb-img" src="" alt="screenshot"/>
</div>

<script>

let poll = null;

function startScan(){

  const url = document.getElementById('url-input').value.trim();

  if(!url){
    alert('Paste a Power BI report URL first.');
    return;
  }

  document.getElementById('scan-btn').disabled = true;

  document.getElementById('results-card').style.display = 'none';

  document.getElementById('progress-card').style.display = 'block';

  document.getElementById('progress-list').innerHTML = '';

  document.getElementById('results-grid').innerHTML = '';

  setStatus('running','Starting scan...');

  fetch('/start_scan',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({url})
  })
  .then(r=>r.json())
  .then(d=>{

    if(d.error){
      setStatus('done-err',d.error);
      resetBtn();
      return;
    }

    poll = setInterval(pollStatus, 1500);

  })
  .catch(e=>{
    setStatus('done-err','Failed to start: '+e);
    resetBtn();
  });
}

function pollStatus(){

  fetch('/scan_status')
    .then(r=>r.json())
    .then(d=>{

      renderProgress(d.log || []);

      setStatus('running', d.current_step || 'Working...');

      if(d.status === 'done'){

        clearInterval(poll);

        renderResults(d.results || []);

        const results = d.results || [];

        const errors = results.filter(p=>p.page_status==='error').length;

        const timeouts = results.filter(p=>p.page_status==='timeout').length;

        if(errors > 0){

          setStatus(
            'done-err',
            `${errors} page(s) with visual errors found`
          );

        }
        else if(timeouts > 0){

          setStatus(
            'done-warning',
            `${timeouts} page(s) exceeded visual load SLA`
          );

        }
        else{

          setStatus(
            'done-ok',
            'All pages clean — no visual errors detected.'
          );
        }

        resetBtn();
      }

      if(d.status === 'error'){

        clearInterval(poll);

        setStatus(
          'done-err',
          d.message || 'Scan failed.'
        );

        resetBtn();
      }

    });
}

function renderProgress(log){

  const ul = document.getElementById('progress-list');

  ul.innerHTML='';

  log.forEach(e=>{

    const li = document.createElement('li');

    const dot = document.createElement('div');

    dot.className = 'dot ' + (e.state || 'pending');

    li.appendChild(dot);

    li.appendChild(
      document.createTextNode(e.message)
    );

    ul.appendChild(li);
  });

  ul.scrollTop = ul.scrollHeight;
}

function renderResults(results){

  const grid = document.getElementById('results-grid');

  const card = document.getElementById('results-card');

  const badge = document.getElementById('summary-badge');

  grid.innerHTML = '';

  card.style.display = 'block';

  const errors = results.filter(
    p=>p.page_status==='error'
  ).length;

  const timeouts = results.filter(
    p=>p.page_status==='timeout'
  ).length;

  if(errors > 0){

    badge.textContent = `${errors} Error(s)`;

    badge.className = 'badge badge-error';

  }
  else if(timeouts > 0){

    badge.textContent = `${timeouts} Timeout(s)`;

    badge.className = 'badge badge-warning';

  }
  else{

    badge.textContent = 'All clean';

    badge.className = 'badge badge-ok';
  }

  if(!results.length){

    grid.innerHTML =
      '<p style="color:#999;font-size:14px">No pages scanned.</p>';

    return;
  }

  results.forEach(p=>{

    const c = document.createElement('div');

    c.className = 'page-card ' + (p.page_status || 'ok');

    const h = document.createElement('div');

    h.className = 'pc-header';

    let icon = 'ꪜ';

    if(p.page_status === 'error'){
      icon = '✗';
    }
    else if(p.page_status === 'timeout'){
      icon = '⏱';
    }

    h.innerHTML = icon + ' ' + esc(p.page_name);

    c.appendChild(h);

    if(p.screenshot){

      const img = document.createElement('img');

      img.src = '/screenshot/' + p.screenshot;

      img.alt = 'Screenshot';

      img.onclick = ()=>openLb('/screenshot/' + p.screenshot);

      c.appendChild(img);
    }

    const b = document.createElement('div');

    b.className = 'pc-body';

    if(p.page_status === 'error'){

      b.textContent = 'Visual error detected';

    }
    else if(p.page_status === 'timeout'){

      b.textContent = 'Visual load exceeded 250s SLA';

    }
    else{

      b.textContent = 'No errors found';
    }

    c.appendChild(b);

    grid.appendChild(c);
  });
}

function setStatus(type,msg){

  const bar = document.getElementById('status-bar');

  bar.className = 'status-bar ' + type;

  document.getElementById('status-text').textContent = msg;

  document.getElementById('spinner').style.display =
    type === 'running'
      ? 'block'
      : 'none';
}

function resetBtn(){
  document.getElementById('scan-btn').disabled = false;
}

function openLb(src){

  document.getElementById('lb-img').src = src;

  document.getElementById('lightbox').className = 'open';
}

function closeLb(){

  document.getElementById('lightbox').className = '';
}

function esc(s){

  return s
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

</script>

</body>
</html>
